<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23365C">
<meta name="description" content="지문별 9단계 내신점검시험과 변형문제를 반·학생별로 기록하고 추적하는 앱">
<title>내신 지문 트래커</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지문트래커">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header + class chips, tab bar, one working pane; tables scroll inside their own wrappers. */
:root {
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --line: #E1E4EA;
  --line-strong: #C9CFD9;
  --ink: #18223A;
  --ink-2: #4B5568;
  --ink-3: #868FA0;
  --accent: #23365C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECF6;
  --marker: #F7DC5A;
  --marker-ink: #3D3200;
  --pass: #1D8A4C;
  --pass-soft: #E1F3E8;
  --fail: #C0402B;
  --fail-soft: #FBE6E1;
  --warn: #A86A12;
  --warn-soft: #FCF0DA;
  --shadow: 0 1px 2px rgba(24, 34, 58, .06), 0 4px 16px rgba(24, 34, 58, .06);
  --scrim: rgba(16, 22, 36, .42);
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141B; --surface: #171C25; --surface-2: #1C2230; --line: #283041; --line-strong: #3A4459;
    --ink: #E6EAF2; --ink-2: #A8B1C2; --ink-3: #6E798C;
    --accent: #9DB7EE; --accent-ink: #0F1626; --accent-soft: #1F2A40;
    --marker: #E8C93A; --marker-ink: #2A2200;
    --pass: #4FC27F; --pass-soft: #15301F; --fail: #F27C68; --fail-soft: #3A1D18; --warn: #E3A94A; --warn-soft: #33281A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141B; --surface: #171C25; --surface-2: #1C2230; --line: #283041; --line-strong: #3A4459;
  --ink: #E6EAF2; --ink-2: #A8B1C2; --ink-3: #6E798C;
  --accent: #9DB7EE; --accent-ink: #0F1626; --accent-soft: #1F2A40;
  --marker: #E8C93A; --marker-ink: #2A2200;
  --pass: #4FC27F; --pass-soft: #15301F; --fail: #F27C68; --fail-soft: #3A1D18; --warn: #E3A94A; --warn-soft: #33281A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font);
  -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 0; }
.brandrow { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; flex: none; }
.sync { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync.online::before { background: var(--pass); }
.sync.error::before { background: var(--fail); }
.sync.syncing::before { background: var(--warn); }
.classes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.classes::-webkit-scrollbar { display: none; }
.cchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px; font-weight: 500; }
.cchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cchip.add { border-style: dashed; color: var(--ink-2); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 10px 12px 11px; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

main { padding-block: 20px 96px; display: flex; flex-direction: column; gap: 20px; }
h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 0; color: var(--ink-2); font-weight: 600; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head .hint { color: var(--ink-3); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi .lab { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.kpi .val { font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.kpi .sub { font-size: 12px; color: var(--ink-2); }
.kpi.dday .val { color: var(--fail); }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { padding: 0; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
thead th { background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 6px; line-height: 1.3; position: sticky; top: 0; }
tbody tr:last-child > * { border-bottom: 0; }
tfoot td, tfoot th { background: var(--surface-2); border-top: 1px solid var(--line-strong); border-bottom: 0; font-size: 12px; padding: 8px 6px; }
.stick { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 6px 12px; border-right: 1px solid var(--line); white-space: nowrap; }
thead .stick, tfoot .stick { background: var(--surface-2); z-index: 2; }
.namebtn { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; }
.namebtn:hover { text-decoration: underline; }
.step-h { min-width: 74px; }
.step-h .th { display: block; font-family: var(--mono); font-weight: 500; color: var(--ink-3); font-size: 11px; }

/* heat cells */
.hc { --p: 0; width: 100%; min-width: 64px; height: 46px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: color-mix(in oklab, var(--pass) calc(var(--p) * 55%), var(--surface)); color: var(--ink); font-family: var(--mono); font-size: 13px; position: relative; }
.hc small { color: var(--ink-3); font-size: 11px; }
.hc.none { background: var(--surface); color: var(--ink-3); }
.hc.ready { background: var(--pass); color: var(--surface); }
.hc.ready small { color: inherit; opacity: .8; }
.hc .vbar { width: 34px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; display: block; }
.hc .vbar::after { content: ""; display: block; height: 100%; width: calc(var(--v) * 100%); background: var(--accent); }
.hc.ready .vbar { background: color-mix(in oklab, var(--surface) 40%, transparent); }
.hc.ready .vbar::after { background: var(--surface); }
.hc.flag::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--fail); }
.hc:hover { outline: 2px solid var(--accent); outline-offset: -2px; }

.sc { width: 100%; min-width: 66px; height: 40px; border: 0; background: var(--surface); font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.sc.pass { background: var(--pass-soft); color: var(--pass); font-weight: 600; }
.sc.fail { background: var(--fail-soft); color: var(--fail); font-weight: 600; }
.sc.next { box-shadow: inset 0 -3px 0 var(--marker); }
.sc:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.sc .cnt { font-size: 10px; opacity: .7; margin-left: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }

/* chips / pills */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.pass { background: var(--pass-soft); color: var(--pass); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.none { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.pill.mark { background: var(--marker); color: var(--marker-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* bars */
.bars { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 92px; gap: 8px 12px; align-items: center; }
.bars .lab { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .track { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); border-radius: 6px 0 0 6px; }
.bars .low .fill { background: var(--warn); }
.bars .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .date { font-family: var(--mono); font-size: 12px; color: var(--ink-3); flex: none; }
.xdel { border: 0; background: none; color: var(--ink-3); font-size: 12px; padding: 3px 8px; border-radius: 6px; flex: none; }
.xdel:hover { color: var(--fail); background: var(--fail-soft); }
.xdel[data-armed] { color: var(--surface); background: var(--fail); font-weight: 700; }
.linkbtn { border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.linkbtn:hover .grow { text-decoration: underline; }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .flabel { font-size: 12px; color: var(--ink-2); font-weight: 500; }
input[type=text], input[type=number], input[type=date], input[type=url], input[type=password], select, textarea {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%;
}
textarea { resize: vertical; line-height: 1.5; }
input[type=number] { font-family: var(--mono); }
.formrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--fail); border-color: color-mix(in oklab, var(--fail) 40%, var(--line)); }
.btn.danger[data-armed] { background: var(--fail); color: var(--surface); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }

.entry td { padding: 6px 8px; }
.entry td.stick { padding: 6px 12px; }
.entry input { width: 84px; text-align: center; }
.entry input.memo { width: 100%; min-width: 140px; text-align: left; }
.entry .bad { border-color: var(--fail); background: var(--fail-soft); }
.savebar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.savebar .btn { box-shadow: var(--shadow); padding: 10px 20px; }

.callout { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.callout p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre; overflow-x: auto; max-height: 260px; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); max-width: 70ch; }

/* drawer */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; }
.drawer .scrim { position: absolute; inset: 0; background: var(--scrim); }
.drawer .sheet { position: relative; width: min(560px, 100%); height: 100%; background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head .t { font-weight: 700; font-size: 16px; }
.sheet-head .s { font-size: 12px; color: var(--ink-3); }
.sheet-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.xbtn { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.srow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.srow.is-next { border-color: var(--marker); box-shadow: inset 4px 0 0 var(--marker); }
.srow .h { display: flex; align-items: center; gap: 8px; }
.srow .h .idx { font-family: var(--mono); color: var(--ink-3); font-size: 12px; width: 16px; }
.srow .h .nm { font-weight: 600; }
.srow .h .th { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.srow .h .pill { margin-left: auto; }
.atts { display: flex; flex-wrap: wrap; gap: 6px; }
.att { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px 2px 8px; background: var(--surface-2); font-family: var(--mono); }
.att.pass { border-color: color-mix(in oklab, var(--pass) 45%, var(--line)); }
.att.fail { border-color: color-mix(in oklab, var(--fail) 45%, var(--line)); }
.att button { border: 0; background: none; color: var(--ink-3); padding: 0 4px; font-size: 13px; }
.att button[data-armed] { color: var(--fail); font-family: var(--font); font-weight: 700; }
.addline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.addline input[type=number] { width: 76px; text-align: center; }
.addline input.memo { flex: 1; min-width: 120px; width: auto; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 500; max-width: calc(100% - 32px); }
.toast.bad { background: var(--fail); color: #fff; }

.welcome { display: flex; flex-direction: column; gap: 14px; max-width: 640px; padding-block: 24px; }
.welcome h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.welcome .flow { display: flex; flex-wrap: wrap; gap: 6px; }
.welcome .flow span { font-size: 12px; background: var(--surface); border: 1px solid var(--line); padding: 3px 9px; border-radius: 6px; }
.welcome .flow span:nth-child(odd) { background: var(--accent-soft); }

@media (prefers-reduced-motion: no-preference) {
  .drawer .sheet { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#23365C"/><rect x="14" y="17" width="36" height="5" rx="2.5" fill="#fff" opacity=".55"/><rect x="12" y="28" width="40" height="10" rx="3" fill="#F7DC5A"/><rect x="14" y="31" width="30" height="4" rx="2" fill="#23365C" opacity=".85"/><rect x="14" y="44" width="24" height="5" rx="2.5" fill="#fff" opacity=".55"/></svg>
        <span>내신 지문 트래커</span>
      </div>
      <span class="sync" id="sync">불러오는 중</span>
    </div>
    <div class="classes" id="classes" role="toolbar" aria-label="반 선택"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="drawer" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
