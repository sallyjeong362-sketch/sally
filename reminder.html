<style>
/* Layout: teacher's binder — class tree on the left, the selected class's lesson log or reminder on the right. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1D2939; --muted:#5F6B7A; --line:#D9DFE7;
  --accent:#2B59C3; --accent-ink:#FFFFFF; --mark:#FFE15A; --mark-ink:#1D2939;
  --danger:#B42318; --soft:#E8EEFA;
  --f-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --ink:#E5E9EF; --muted:#9AA5B3; --line:#2B3440;
  --accent:#7EA1FF; --accent-ink:#0E1420; --mark:#6B5A12; --mark-ink:#FFF3B8;
  --danger:#FF8A80; --soft:#1F2A3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --ink:#E5E9EF; --muted:#9AA5B3; --line:#2B3440;
  --accent:#7EA1FF; --accent-ink:#0E1420; --mark:#6B5A12; --mark-ink:#FFF3B8;
  --danger:#FF8A80; --soft:#1F2A3D; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--surface);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
main{padding-block:24px 64px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:860px}

.brand{font-family:var(--f-display);font-size:24px;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.02em}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-toggle{display:none}
.side-body{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.school>.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.grade{margin-top:4px}
.grade>.lbl{font-size:13px;color:var(--muted);padding-left:2px}
.cls{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:15px}
.cls:hover{background:var(--soft)}
.cls[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cls .cnt{float:right;font-family:var(--f-mono);font-size:12px;opacity:.75}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:none;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{width:100%;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.crumb{font-size:13px;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:34px;line-height:1.15}
.tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:14px}
.sess-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.no{font-family:var(--f-mono);font-size:13px;background:var(--ink);color:var(--surface);padding:2px 8px;border-radius:4px}
.date{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.psg{padding:12px 0;border-top:1px dashed var(--line)}
.psg:first-of-type{border-top:0}
.psg-title{font-weight:700}
.gist{margin:2px 0 0}
.gist .m{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit}
ul.pts{margin:6px 0 0;padding-left:20px}
ul.pts li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--bg)}
.struct{margin-top:6px;font-size:14px;color:var(--muted)}
.struct div::before{content:"구문 · ";font-weight:700;color:var(--ink)}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:6px}

label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-weight:400;font-size:15px}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pe{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pe-head{display:flex;gap:8px;align-items:center}
.pe-head .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.pe-head input{flex:1;min-width:0;font-weight:700}

.tier{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
.tier.full{background:var(--mark);color:var(--mark-ink)}
.note{font-size:13px;color:var(--muted);margin:0 0 14px}
.ai{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.ai pre{white-space:pre-wrap;font-family:var(--f-body);margin:10px 0 0;font-size:15px;line-height:1.7}
.ai h3{font-size:19px}

.banner{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--accent);padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:16px}
.confirm{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.confirm .card{max-width:380px;width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* key words, blanks, passage structure */
mark.kw{background:none;color:var(--accent);font-weight:700}
.blank{display:inline-block;min-width:4.5em;border:0;border-bottom:2px solid var(--accent);background:var(--soft);color:var(--accent);font-family:var(--f-mono);font-size:.85em;padding:0 8px;margin:0 2px;border-radius:4px 4px 0 0;cursor:pointer;line-height:1.5;vertical-align:baseline}
.blank{max-width:100%;white-space:normal;text-align:left}
.blank.open{font-family:var(--f-body);font-size:1em;font-weight:700;background:var(--mark);color:var(--mark-ink);border-color:var(--mark-ink)}
.flow{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.flow li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 0 6px 12px;border-left:2px solid var(--line);position:relative}
.flow li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.flow .step{font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:1px 8px;border-radius:4px;white-space:nowrap}
.flow-mini{font-size:13px;color:var(--muted);margin-top:4px}
.flow-mini b{color:var(--accent);font-weight:700}
.pe-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vocab{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.vrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.vw{font-weight:700}
.vm{color:var(--muted)}
.rel b{color:var(--accent);margin-right:2px}
.blank sup{font-size:.62em;margin-right:3px;opacity:.75}
.blank.hint .f{font-family:var(--f-body);font-size:1.15em;font-weight:700}
.vt{display:flex;flex-direction:column;gap:6px}
.vt-label{font-size:13px;font-weight:700}
.vt-row{display:grid;grid-template-columns:1.1fr 1.1fr 1.4fr 1.2fr auto;gap:6px;align-items:center}
.vt-head{font-size:12px;color:var(--muted)}
@media (max-width:600px){.vt-row{grid-template-columns:1fr 1fr auto}.vt-row input:nth-child(3),.vt-row input:nth-child(4){grid-column:span 1}.vt-head{display:none}}
.pr-slide .vocab{font-size:.9em}
.pr-slide .flow .step{font-size:.7em}

/* presentation */
#present{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pr-bar{display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.timer{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.timer.over{color:var(--danger)}
.pr-body{flex:1;overflow:auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pr-slide{max-width:1000px;margin:0 auto;font-size:clamp(17px,2.2vw,24px);line-height:1.6}
.pr-slide h2{font-size:clamp(30px,4.5vw,52px);margin-bottom:12px}
.pr-slide .chip{font-size:.8em}
.pr-slide .psg{padding:18px 0}
.pr-count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side-toggle{display:inline-flex}
  .side-body{display:none}
  aside.open .side-body{display:flex}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:18px 48px}
  .head h1{font-size:28px}
  .card{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- data ---------- */
function selectClass(cid) {
  if (unsubSess) { unsubSess(); unsubSess = null; }
  S.cid = cid; S.sessions = []; S.sessLoaded = false; S.editing = null; S.copying = null; S.remindN = null; S.aiText = '';
  if (cid) store.set('remind.cid', cid);
  if (!cid || !S.db) return render();
  unsubSess = S.db.collection(`classes/${cid}/sessions`).orderBy('no').onSnapshot(snap => {
    S.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.sessLoaded = true; render();
  }, err => { toast('회차 기록을 불러오지 못했어요. 새로고침해 주세요.'); });
  render();
}
const cls = () => S.classes.find(c => c.id === S.cid);
const maxNo = () => S.sessions.reduce((m, s) => Math.max(m, s.no || 0), 0);

async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === 'invalid_argument') { S.readOnly = true; render(); toast('이 계정은 보기 권한만 있어서 저장할 수 없어요.'); }
    else if (e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 오래된 회차를 지워 주세요.');
    else toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
    return false;
  }
}

/* ---------- side ---------- */
function renderSide() {
  const c = cls();
  const groups = {};
  for (const k of S.classes) ((groups[k.school || '학교 미지정'] ||= {})[k.grade || '학년 미지정'] ||= []).push(k);
  let tree = '';
  for (const sch of Object.keys(groups).sort(ko)) {
    tree += `<div class="school"><div class="lbl">${esc(sch)}</div>`;
    for (const gr of Object.keys(groups[sch]).sort(ko)) {
      tree += `<div class="grade"><div class="lbl">${esc(gr)}</div>`;
      for (const k of groups[sch][gr].sort((a, b) => ko(a.name, b.name)))
        tree += `<button class="cls" data-act="sel" data-id="${esc(k.id)}" aria-current="${k.id === S.cid}">${esc(k.name)}</button>`;
      tree += `</div>`;
    }
    tree += `</div>`;
  }
  $('#side').className = S.sideOpen ? 'open' : '';
  $('#side').innerHTML = `
    <div class="side-top">
      <div class="brand">지문 리마인더<small>내신 수업 10분 복습 노트</small></div>
      <button class="btn side-toggle" data-act="side" aria-expanded="${S.sideOpen}">${c ? esc(c.name) : '반 목록'} ▾</button>
    </div>
    <div class="side-body">
      ${tree || (S.ready ? '<p class="muted" style="margin:0">아직 만든 반이 없어요.</p>' : '')}
      ${S.db && !S.readOnly ? `<button class="btn block" data-act="cls-new">+ 반 추가</button>` : ''}
    </div>`;
}

  renderSide();
  const m = $('#main');
  if (S.noDb) {
    m.innerHTML = `<div class="wrap"><div class="card empty"><h2>claude.ai에서 열어 주세요</h2>
      <p>수업 기록은 온라인 저장소에 보관돼요. claude.ai에 로그인한 상태로 이 페이지를 열면 기록을 보고 저장할 수 있어요.</p></div></div>`;
    return;
  }
  if (!S.ready) { m.innerHTML = `<div class="wrap"><p class="muted">불러오는 중…</p></div>`; return; }
  let h = '<div class="wrap">';
  if (S.readOnly) h += `<div class="banner">보기 전용이에요. 기록을 추가하거나 고치려면 이 페이지의 주인에게 편집 권한을 받아야 해요.</div>`;
  if (S.classForm) h += classFormHtml();
  const c = cls();
  if (!c && !S.classForm) {
    h += `<div class="card empty"><h2>첫 반을 만들어 볼까요?</h2>
      <p>학교 · 학년 · 반을 만들고, 수업이 끝날 때마다 다룬 지문을 회차별로 적어 두세요.<br>다음 수업 시작할 때 <b>리마인드</b> 탭에서 지난 회차들을 한 번에 복습할 수 있어요.</p>
      ${S.readOnly ? '' : '<button class="btn primary" data-act="cls-new">+ 반 추가</button>'}</div>`;
  }
  if (c && !(S.classForm && S.classForm.id === c.id)) {
    h += `<div class="head"><div><div class="crumb">${esc(c.school)} › ${esc(c.grade)}</div><h1>${esc(c.name)}</h1></div>

/* --- blanks: text in [brackets] becomes a blank; vocab words are blanked too ---
   ctx null = normal view (key words highlighted); otherwise {n, answers, mode:'screen'|'print'}
   shares one counter, so the class screen and the printed sheet number blanks identically. */
const unbr = s => String(s || '').replace(/\[([^\]]+)\]/g, '$1');
// Blanks go only on bracketed key words and key phrases inside the content lines, so the rest of each
// sentence stays as a cue. The vocab list is never blanked.
function blank(ans, ctx) {
  if (!ctx) return `<mark class="kw">${esc(ans)}</mark>`;
  const n = ++ctx.n; ctx.answers.push(ans);
  const w = Math.min(14, Math.max(4.5, ans.length * 0.65 + 2)).toFixed(1);
  if (ctx.mode === 'print') return `<span class="bl" style="min-width:${w}em">(${n})</span>`;
  return `<button class="blank" data-act="reveal" data-n="${n}" data-ans="${esc(ans)}" style="min-width:${w}em" aria-label="빈칸 ${n}">${n}</button>`;
}
const rich = (text, ctx) => String(text || '').split(/\[([^\]]+)\]/).map((p, i) => i % 2 ? blank(p, ctx) : esc(p)).join('');
const hasKeyBlanks = p => ['gist', 'flow', 'points'].some(k => String(p[k] || '').includes('['));
function flowHtml(text, ctx, mini) {
  const steps = lines(text).map(l => { const k = l.indexOf(':'); return k > 0 && k < 14 ? [l.slice(0, k).trim(), l.slice(k + 1).trim()] : ['', l]; });
  if (!steps.length) return '';
  if (mini) return `<div class="flow-mini">구조 · ${steps.map(([a, b]) => a ? `<b>${esc(unbr(a))}</b>` : esc(unbr(b)).slice(0, 12)).join(' → ')}</div>`;
  return `<ol class="flow">${steps.map(([a, b]) => `<li>${a ? `<span class="step">${esc(unbr(a))}</span>` : '<span></span>'}<span>${rich(b, ctx)}</span></li>`).join('')}</ol>`;
}
/* --- vocab: word, meaning, synonyms, antonyms. In reminders the synonyms and antonyms keep only their
   first letter, so students write them out again every session. --- */
const listOf = s => String(s || '').split(/[,;/]/).map(x => x.trim()).filter(Boolean);
const blankWord = () => ({ w: '', m: '', syn: '', ant: '' });
function wordsOf(p) {
  if (Array.isArray(p.words)) return p.words.filter(x => x && String(x.w || '').trim());
  return lines(unbr(p.vocab)).map(l => { const m = l.match(/^([A-Za-z][A-Za-z '.~-]*?)\s+(.*)$/); return m ? { w: m[1], m: m[2], syn: '', ant: '' } : { w: l, m: '', syn: '', ant: '' }; });
}
function firstLetterBlank(v, ctx) {
  if (!ctx) return esc(v);
  const n = ++ctx.n; ctx.answers.push(v);
  const w = Math.min(10, Math.max(3.5, v.length * 0.6 + 1.5)).toFixed(1), body = `<sup>${n}</sup><span class="f">${esc(v[0])}</span>`;
  if (ctx.mode === 'print') return `<span class="bl" style="min-width:${w}em">${body}</span>`;
  return `<button class="blank hint" data-act="reveal" data-n="${n}" data-ans="${esc(v)}" style="min-width:${w}em" aria-label="빈칸 ${n}, ${esc(v[0])}로 시작">${body}</button>`;
}
function vocabHtml(ws, ctx, relatedOnly) {
  if (relatedOnly) ws = ws.filter(x => listOf(x.syn).length || listOf(x.ant).length);
  if (!ws.length) return '';
  const rel = (sym, label, s) => { const a = listOf(s); return a.length ? `<span class="rel"><b title="${label}">${sym}</b> ${a.map(v => firstLetterBlank(v, ctx)).join(', ')}</span>` : ''; };
  return `<div class="vocab">${ws.map(x => `<div class="vrow"><span class="vw">${esc(x.w)}</span><span class="vm">${esc(x.m)}</span>${rel('≒', '동의어', x.syn)}${rel('↔', '반의어', x.ant)}</div>`).join('')}</div>`;
}

function passageHtml(p, t, ctx) {
  const pts = lines(p.points), ws = wordsOf(p), st = lines(p.structure);
  const title = esc(unbr(p.title) || '제목 없는 지문');
  if (t === 'short') return `<div class="psg"><span class="psg-title">${title}</span>${p.gist ? ` — <span class="gist"><span class="m">${rich(p.gist, ctx)}</span></span>` : ''}</div>`;
  if (t === 'mid') return `<div class="psg"><div class="psg-title">${title}</div>
    ${p.gist ? `<p class="gist"><span class="m">${rich(p.gist, ctx)}</span></p>` : ''}
    ${flowHtml(p.flow, ctx, true)}
    ${pts.length ? `<ul class="pts">${pts.slice(0, 2).map(x => `<li>${rich(x, ctx)}</li>`).join('')}</ul>` : ''}
    ${vocabHtml(ws, ctx, true)}</div>`;
  return `<div class="psg">
    <div class="psg-title">${title}</div>
    ${p.gist ? `<p class="gist"><span class="m">${rich(p.gist, ctx)}</span></p>` : ''}
    ${flowHtml(p.flow, ctx)}
    ${pts.length ? `<ul class="pts">${pts.map(x => `<li>${rich(x, ctx)}</li>`).join('')}</ul>` : ''}
    ${vocabHtml(ws, ctx)}
    ${st.length ? `<div class="struct">${st.map(x => `<div>${esc(unbr(x))}</div>`).join('')}</div>` : ''}
  </div>`;
}

/* --- remind view --- */
const prevOf = N => S.sessions.filter(s => s.no < N).sort((a, b) => a.no - b.no);
const tierOf = (N, no) => { const d = N - no; return d <= 1 ? 'full' : d <= 3 ? 'mid' : 'short'; };
const tierLabel = (N, no) => N - no <= 1 ? '지난 시간' : `${N - no}회 전`;

function remindSession(s, N, big, ctx) {
  const t = tierOf(N, s.no);
  return `<div class="${big ? '' : 'card'}">
    <div class="sess-head">${big ? `<h2 style="margin:0">${s.no}회차</h2>` : `<span class="no">${s.no}회차</span>`}<span class="date">${esc(s.date || '')}</span><span class="tier ${t}">${tierLabel(N, s.no)}</span></div>
    <div style="margin-top:6px">${(s.passages || []).map(p => passageHtml(p, t, ctx)).join('') || '<p class="muted">적어 둔 지문이 없어요.</p>'}</div></div>`;
}
// One pass over sessions 1..N-1 with a shared blank counter (mode null = answers shown).
function buildRemind(N, mode, big) {
  const ctx = mode ? { n: 0, answers: [], mode } : null;
  const parts = prevOf(N).map(s => ({ s, html: remindSession(s, N, big, ctx) }));
  return { parts, answers: ctx ? ctx.answers : [] };
}

function remindHtml() {
  const mx = maxNo();
  if (!mx) return `<div class="card empty"><h2>복습할 회차가 아직 없어요</h2><p>회차 기록 탭에서 1회차 수업 내용을 먼저 적어 주세요.</p></div>`;
  const N = S.remindN || mx + 1;
  const prev = prevOf(N);
  const saved = (cls().reminders || {})[String(N)];
  let opts = '';
  for (let n = mx + 1; n >= 2; n--) opts += `<option value="${n}" ${n === N ? 'selected' : ''}>${n === mx + 1 ? `다음 수업 (${n}회차)` : `${n}회차 수업`} · 1~${n - 1}회차 복습</option>`;
  const nBlanks = buildRemind(N, 'print').answers.length;
  let h = `<div class="row" style="margin-bottom:10px">
      <select id="remind-n" aria-label="리마인드할 수업" style="width:auto;max-width:100%">${opts}</select>
      <button class="btn primary" data-act="present" data-blanks="1">▶ 빈칸 퀴즈로 띄우기</button>
      <button class="btn" data-act="present">정답 화면으로 띄우기</button>
      ${S.downloads ? `<button class="btn" data-act="sheet">학습지 저장 (인쇄용)</button>` : ''}</div>
    <p class="note">바로 지난 회차는 자세히, 2~3회 전은 요지와 포인트 두 개, 그보다 오래된 회차는 요지 한 줄로 줄여서 보여 줘요.<br>
      글의 구조·시험 포인트 문장 속 <b>핵심어와 핵심 구문</b>([대괄호]로 묶은 말)만 빈칸이 되고, 나머지 문장과 괄호 속 출제 메모는 남아서 내용을 떠올리는 실마리가 돼요.
      지금 빈칸은 <b>${nBlanks}개</b>이고, 화면과 학습지의 빈칸 번호가 같아요.</p>`;
  const bare = prev.flatMap(s => s.passages || []).filter(p => !hasKeyBlanks(p)).length;
  if (bare) h += `<div class="banner row">핵심어 빈칸을 정하지 않은 지문이 <b>${bare}개</b> 있어요. 이 지문들은 빈칸 없이 보여요.
      <span class="spacer"></span>${S.sample && !S.readOnly ? `<button class="btn" data-act="ai-keys" ${S.keysBusy ? 'disabled' : ''}>${S.keysBusy ? 'AI가 고르는 중…' : 'AI로 핵심어 빈칸 정하기'}</button>` : ''}</div>`;
  if (S.sample) {
    const text = S.aiBusy ? S.aiText : saved ? saved.text : '';
    h += `<div class="ai" style="margin-bottom:16px">
      <div class="row"><h3>AI 누적 정리</h3><span class="spacer"></span>
        ${S.aiBusy ? `<button class="btn" data-act="ai-stop">멈추기</button>`
          : S.readOnly ? '' : `<button class="btn" data-act="ai-remind">${saved ? '다시 만들기' : `1~${N - 1}회차 한 번에 정리하기`}</button>`}</div>
      ${S.aiBusy && !S.aiText ? '<p class="muted" style="margin:8px 0 0">정리하는 중… (보통 10~30초 걸려요)</p>' : ''}
      ${text ? `<pre id="ai-out">${esc(text)}</pre>` : S.aiBusy ? '<pre id="ai-out"></pre>' : `<p class="muted" style="margin:6px 0 0">지난 회차 기록을 읽고 10분 복습용 요약과 확인 질문을 만들어 줘요. 만든 내용은 이 반에 저장돼요.</p>`}
      ${saved && !S.aiBusy ? `<p class="hint" style="margin:8px 0 0">${new Date(saved.at).toLocaleString('ko-KR')}에 만듦</p>` : ''}
    </div>`;
  }
  h += `<div class="stack">${prev.map(s => remindSession(s, N, false, null)).join('')}</div>`;
  return h;
}

/* ---------- AI ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'AI 사용이 허용되지 않았어요. 직접 입력해 주세요.';
  if (c === 'rate_limited') return 'AI 사용량이 많아요. 잠시 후 다시 눌러 주세요.';
  if (c === 'invalid_json') return 'AI 답을 읽지 못했어요. 한 번 더 눌러 주세요.';
  if (c === 'prompt_too_large') return '내용이 너무 길어요. 원문을 조금 줄여 주세요.';
  if (c === 'cancelled') return '';
  return 'AI가 답하지 못했어요. 잠시 후 다시 시도해 주세요.';
}

async function aiFill(i) {
  const p = S.editing.data.passages[i];
  if (!String(p.raw || '').trim()) return toast('원문이나 수업 메모를 먼저 붙여넣어 주세요.');
  p._busy = true; render();
  try {
    const r = await S.sample.json(
      '너는 한국 고등학교 영어 내신 수업을 돕는 조교야. 아래 영어 지문(또는 수업 메모)을 읽고, 다음 수업 시작 때 10분 복습에 쓸 요약을 만들어.\n' +
      '반드시 JSON 객체 하나만 답해. 형식:\n' +
      '{"title":"출처를 알 수 있으면 짧게, 모르면 빈 문자열","gist":"한국어 한 줄 요지 (40자 이내)","flow":["글의 구조를 3~5단계로, 각 항목은 \'단계: 내용\' 형식 (단계 예: 도입, 통념, 주장, 반박, 근거, 예시, 결론)"],"points":["지문 내용을 흐름대로 정리한 한국어 문장 4~5개. 각 문장 끝 괄호에 출제 메모 (예: \'1910년대에는 입꼬리가 거의 [수평]에 가까웠다 (연결어 But in the post-World War II era 주목)\'). 연도·수치 같은 근거도 넣고, 마지막 줄은 순서·삽입 포인트"],"vocab":[{"w":"중요 어휘 5~8개 (영어 단어)","m":"지문 속 뜻 (한국어)","syn":["지문 속 뜻에 맞는 동의어 1~3개"],"ant":["반의어 0~2개, 없으면 빈 배열"]}],"structure":["시험에 나올 핵심 구문·어법 2~3개, 원문 표현 + 짧은 설명"]}\n' +
      '학생 복습용 빈칸 퀴즈로도 쓸 거야. flow, points의 각 줄에서 내용의 핵심이 되는 키워드나 짧은 핵심 구문(1~4단어)을 1~4개 [대괄호]로 묶어 줘. 문장 전체, 괄호 속 출제 메모, 연도·숫자는 묶지 마. gist, flow의 단계 이름, vocab, structure에는 대괄호를 쓰지 마.\n\n' +
      '지문/메모:\n' + String(p.raw).slice(0, 15000));
    const arr = v => Array.isArray(v) ? v.map(String).join('\n') : String(v || '');
    if (!p.title && r.title) p.title = String(r.title);
    if (r.gist) p.gist = String(r.gist);
    if (r.flow) p.flow = arr(r.flow);
    if (r.points) p.points = arr(r.points);
    if (Array.isArray(r.vocab)) {
      const ws = r.vocab.map(x => typeof x === 'string' ? wordsOf({ vocab: x })[0] : { w: String(x.w || ''), m: String(x.m || ''), syn: [].concat(x.syn || []).map(String).join(', '), ant: [].concat(x.ant || []).map(String).join(', ') }).filter(x => x && x.w);
      if (ws.length) p.words = ws.map(x => ({ ...blankWord(), ...x }));
    }
    if (r.structure) p.structure = unbr(arr(r.structure));
    toast('AI 초안을 채웠어요. 확인하고 저장해 주세요.');
  } catch (e) { const t = errText(e); if (t) toast(t); }
  finally { p._busy = false; render(); }
}

// Ask Claude to bracket 1-2 key words or short key phrases per line. A line comes back only with brackets
// added; if Claude changed any other character, the original line is kept.
async function aiKeyBlanks(passages) {
  // The gist stays visible as the passage's anchor, so it is not sent.
  const items = passages.map(p => ({ id: p.id, flow: lines(unbr(p.flow)), points: lines(unbr(p.points)) }));
  const r = await S.sample.json(
    '고등학교 영어 내신 수업의 지문 복습용 빈칸 퀴즈를 만들려고 해. 학생이 빈칸 밖에 남은 말을 실마리로 지문 내용의 흐름을 떠올릴 수 있어야 해.\n' +
    '아래 각 줄에서 지문 내용의 핵심이 되는 키워드나 짧은 핵심 구문을 [대괄호]로 묶어 줘.\n' +
    '규칙:\n- 한 줄에 1~4개. 각 빈칸은 1~4단어로 짧게. 문장 전체나 절 전체를 묶지 마.\n' +
    '- 묶을 것: 지문 내용을 이해했는지 확인할 수 있는 내용어 (예: "100년 전 사진은 [무표정]이 보통", "[작은 입]이 아름답다고 여겨졌다", "촬영을 [즐거움]과 연결").\n' +
    '- 묶지 말 것: 괄호 ( ) 안의 출제 메모, 연도·숫자·자료 출처 같은 근거, "~이다/~했다" 같은 서술어, 접속어. 이것들은 실마리로 남겨 둬.\n' +
    '- 순서·삽입처럼 흐름을 설명하는 줄은 핵심이 되는 말 1개만 묶거나 묶지 않아도 돼.\n' +
    '- flow 줄의 "단계:" 이름(콜론 앞)은 묶지 마.\n' +
    '- 대괄호만 추가하고 글자는 하나도 바꾸거나 빼지 마. 줄 수와 순서도 그대로.\n' +
    '반드시 JSON 객체 하나만 답해: {"passages":[{"id":"...","flow":["..."],"points":["..."]}]}\n\n' +
    JSON.stringify({ passages: items }));
  const got = new Map((Array.isArray(r && r.passages) ? r.passages : []).map(x => [String(x && x.id), x]));
  const fix = (orig, cand) => typeof cand === 'string' && cand.includes('[') && unbr(cand).trim() === unbr(orig).trim() ? cand.trim() : orig;
  const fixLines = (text, arr) => lines(text).map((l, k) => fix(l, Array.isArray(arr) ? arr[k] : null)).join('\n');
  return passages.map(p => {
    const x = got.get(p.id); if (!x) return p;
    return { ...p, flow: fixLines(p.flow, x.flow), points: fixLines(p.points, x.points) };
  });
}
async function aiSynAnt(i) {
  const p = S.editing.data.passages[i];
  p.words.forEach(dictFill);
  const need = p.words.filter(x => x.w.trim() && (!x.syn.trim() || !x.ant.trim() || !x.m.trim()));
  if (!need.length) { render(); return toast(p.words.some(x => x.w.trim()) ? '모든 단어가 채워져 있어요.' : '단어를 먼저 적어 주세요.'); }
  p._busy = true; render();
  try {
    const r = await S.sample.json(
      '고등학교 영어 내신 수업에서 다룬 지문의 중요 어휘야. 각 단어에 대해 지문 속 뜻(한국어), 그 뜻에 맞는 동의어 1~3개, 반의어 0~2개(자연스러운 반의어가 없으면 빈 배열)를 알려 줘.\n' +
      (unbr(p.gist) ? `지문 요지: ${unbr(p.gist)}\n` : '') +
      '반드시 JSON 객체 하나만 답해: {"words":[{"w":"단어","m":"뜻","syn":["..."],"ant":["..."]}]}\n\n단어: ' + need.map(x => x.w.trim() + (x.m ? ` (${x.m})` : '')).join(', '));
    const got = new Map((Array.isArray(r && r.words) ? r.words : []).map(x => [String(x && x.w || '').trim().toLowerCase(), x]));
    for (const x of need) {
      const g = got.get(x.w.trim().toLowerCase()); if (!g) continue;
      if (!x.m.trim() && g.m) x.m = String(g.m);
      if (!x.syn.trim()) x.syn = [].concat(g.syn || []).map(String).join(', ');
      if (!x.ant.trim()) x.ant = [].concat(g.ant || []).map(String).join(', ');
    }
    toast('빈 칸을 채웠어요. 확인하고 저장해 주세요.');
  } catch (e) { const t = errText(e); if (t) toast(t); }
  finally { p._busy = false; render(); }
}
async function aiKeysOne(i) {

  } catch (e) { const t = errText(e); if (t) toast(t); }

}
async function aiKeysRemind() {
  const N = S.remindN || maxNo() + 1, cid = S.cid;
  const targets = prevOf(N).filter(s => (s.passages || []).some(p => !hasKeyBlanks(p)));
  S.keysBusy = true; render();
  let done = 0;
  try {
    for (const s of targets) {
      const bare = s.passages.filter(p => !hasKeyBlanks(p));
      const fixed = new Map((await aiKeyBlanks(bare)).map(p => [p.id, p]));
      const passages = s.passages.map(p => fixed.get(p.id) || p);
      if (passages.some((p, k) => p !== s.passages[k] && hasKeyBlanks(p)) &&
          await write(() => S.db.doc(`classes/${cid}/sessions/${s.id}`).update({ passages, updatedAt: new Date().toISOString() }))) done++;
    }
    toast(done ? `${done}개 회차에 핵심어 빈칸을 정했어요. 회차 기록에서 고칠 수 있어요.` : 'AI가 빈칸을 고르지 못했어요. 회차 기록에서 직접 골라 주세요.');
  } catch (e) { const t = errText(e); if (t) toast(t); }
  finally { S.keysBusy = false; render(); }
}

let aiCtl = null;
async function aiRemind() {

  S.aiBusy = true; S.aiText = ''; aiCtl = new AbortController(); render();

      const f = S.classForm, data = { school: f.school.trim(), grade: f.grade.trim(), name: f.name.trim() };
      if (!data.school || !data.grade || !data.name) return toast('학교, 학년, 반을 모두 적어 주세요.');
      if (f.id) { if (await write(() => db.doc(`classes/${f.id}`).update(data), '반 정보를 고쳤어요.')) { S.classForm = null; render(); } }
      else {
        const ref = db.collection('classes').doc();
        if (await write(() => ref.set({ ...data, createdAt: new Date().toISOString() }), `${data.name}을 만들었어요.`)) { S.classForm = null; S.view = 'log'; selectClass(ref.id); }
      }
      break;
    }
    case 'cls-del': {
      const c = cls();
      ask(`${c.school} ${c.grade} ${c.name}과 이 반의 회차 기록 ${S.sessions.length}개를 모두 지울까요? 되돌릴 수 없어요.`, '모두 삭제', async () => {
        const ok = await write(async () => {
          const snap = await db.collection(`classes/${c.id}/sessions`).get();
          for (const d of snap.docs) await db.doc(`classes/${c.id}/sessions/${d.id}`).delete();
          await db.doc(`classes/${c.id}`).delete();
        }, '반을 삭제했어요.');
        if (ok) { S.classForm = null; selectClass(null); }
      });
      break;
    }
    case 'sess-new': S.editing = { data: { no: maxNo() + 1, date: today(), passages: [blankPassage()] } }; S.copying = null; render(); break;
    case 'sess-edit': {
      const s = S.sessions.find(x => x.id === id);
      S.editing = { id, data: { no: s.no, date: s.date || '', passages: (s.passages || []).map(p => {
        const ws = wordsOf(p).map(x => ({ ...blankWord(), ...x }));
        return { ...blankPassage(), ...p, words: ws.length ? ws : [blankWord()] };
      }) } };
      if (!S.editing.data.passages.length) S.editing.data.passages.push(blankPassage());
      render(); break;
    }
    case 'sess-cancel': S.editing = null; render(); break;
    case 'p-add': S.editing.data.passages.push(blankPassage()); render(); break;
    case 'p-del': S.editing.data.passages.splice(i, 1); if (!S.editing.data.passages.length) S.editing.data.passages.push(blankPassage()); render(); break;
    case 'p-ai': aiFill(i); break;
    case 'p-keys': aiKeysOne(i); break;
    case 'w-add': S.editing.data.passages[i].words.push(blankWord()); render(); document.getElementById(`p-${S.editing.data.passages[i].id}-w${S.editing.data.passages[i].words.length - 1}`)?.focus(); break;
    case 'w-del': { const ws = S.editing.data.passages[i].words; ws.splice(+b.dataset.k, 1); if (!ws.length) ws.push(blankWord()); render(); break; }
    case 'w-ai': aiSynAnt(i); break;
    case 'ai-keys': aiKeysRemind(); break;
    case 'p-blank': {
      const el = lastField;
      if (!el || !document.contains(el) || +el.dataset.i !== i || ['raw', 'title', 'structure'].includes(el.dataset.f) || el.selectionStart === el.selectionEnd)
        return toast('요지·글의 구조·시험 포인트 칸에서 빈칸으로 만들 말을 먼저 드래그해 주세요.');
      const v = el.value, s = el.selectionStart, t = el.selectionEnd;
      const nv = v.slice(0, s) + '[' + v.slice(s, t) + ']' + v.slice(t);
      S.editing.data.passages[i][el.dataset.f] = nv; render();
      const ne = document.getElementById(el.id); if (ne) { ne.focus(); ne.setSelectionRange(t + 2, t + 2); }
      break;
    }
    case 'sess-save': {
      const ed = S.editing, d = ed.data;
      const passages = d.passages.map(({ _busy, ...p }) => {
        const words = p.words.map(x => ({ w: x.w.trim(), m: x.m.trim(), syn: listOf(x.syn).join(', '), ant: listOf(x.ant).join(', ') })).filter(x => x.w);
        return { ...p, words, vocab: words.map(x => `${x.w} ${x.m}`.trim()).join('\n') };
      }).filter(p => p.words.length || ['title', 'raw', 'gist', 'flow', 'points', 'structure'].some(k => String(p[k] || '').trim()));
      if (!passages.length) return toast('지문을 하나 이상 적어 주세요.');
      const body = { no: d.no, date: d.date, passages, updatedAt: new Date().toISOString() };
      const path = `classes/${S.cid}/sessions`;
      const ok = await write(() => ed.id ? db.doc(`${path}/${ed.id}`).set(body) : db.collection(path).doc().set(body), `${d.no}회차를 저장했어요.`);
      if (ok) { S.editing = null; render(); }
      break;
    }
    case 'sess-del': {
      const ed = S.editing;
      ask(`${ed.data.no}회차 기록을 지울까요? 되돌릴 수 없어요.`, '삭제', async () => {
        if (await write(() => db.doc(`classes/${S.cid}/sessions/${ed.id}`).delete(), '회차를 삭제했어요.')) { S.editing = null; render(); }
      });
      break;
    }
    case 'copy-open': S.copying = id; render(); break;
    case 'copy-cancel': S.copying = null; render(); break;
    case 'copy-do': {
      const s = S.sessions.find(x => x.id === id), to = $('#copy-to').value, k = S.classes.find(c => c.id === to);
      const ok = await write(async () => {
        const snap = await db.collection(`classes/${to}/sessions`).get();
        const no = snap.docs.reduce((m, d) => Math.max(m, d.data().no || 0), 0) + 1;
        await db.collection(`classes/${to}/sessions`).doc().set({ no, date: s.date, passages: s.passages, updatedAt: new Date().toISOString() });
      }, `${k.name}에 복사했어요.`);
      if (ok) { S.copying = null; render(); }
      break;
    }
    case 'ai-remind': aiRemind(); break;
    case 'ai-stop': aiCtl?.abort(); break;
    case 'present': openPresent(!!b.dataset.blanks); break;
    case 'sheet': saveSheet(); break;
    case 'reveal': if (!b.classList.contains('open')) openBlank(b); break;
    case 'pr-openall': $('#present').querySelectorAll('.blank:not(.open)').forEach(openBlank); break;
    case 'pr-mode': { const P = S.present; P.blanks = !P.blanks; P.slides = buildSlides(P.N, P.blanks); drawPresent(); break; }
    case 'pr-reset': S.present.left = S.timerMin * 60; drawPresent(); break;
    case 'pr-close': closePresent(); break;
    case 'pr-next': S.present.i++; drawPresent(); break;
    case 'pr-prev': S.present.i--; drawPresent(); break;
    case 'pr-timer': toggleTimer(); break;
  }
});

/* ---------- start ---------- */
render();
(async () => {
  const [db, user, sample, downloads] = await Promise.all([use('db'), use('user'), use('sample'), use('downloads')]);
  S.sample = sample; S.downloads = downloads;
  if (!db) { S.noDb = true; return render(); }
  S.db = db;
  if (user) { try { if (await user.can('data.write') === false) S.readOnly = true; } catch (e) {} }
  db.collection('classes').onSnapshot(snap => {
    S.classes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const first = !S.ready; S.ready = true;
    if (!S.cid || !S.classes.find(c => c.id === S.cid)) {
      const sorted = [...S.classes].sort((a, b) => ko(a.school + a.grade + a.name, b.school + b.grade + b.name));
      selectClass(sorted[0]?.id || null);
    } else if (first) selectClass(S.cid);
    else render();
  }, () => toast('반 목록을 불러오지 못했어요. 새로고침해 주세요.'));
})();
</script>
